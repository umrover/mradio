<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mradio interface</title>
    <style>
      body {
        font: 14px system-ui, sans-serif;
        max-width: 32em;
        margin: 0 auto;
        padding: 0 1em 2em;
      }
      h2 {
        border-bottom: 1px solid #ccc;
      }
      h3 {
        margin-bottom: 0.25em;
      }
      form[data-section] {
        border: 1px solid #ccc;
        padding: 0 1em 0.75em;
      }
      form p {
        display: grid;
        grid-template-columns: 9em 1fr;
        align-items: center;
        margin: 0.5em 0;
      }
      button:not(:disabled) {
        cursor: pointer;
      }
      output {
        margin-left: 0.5em;
      }
    </style>
  </head>
  <body>
    <h2>Status</h2>

    <p>under construction</p>

    <h2>Config</h2>

    <form data-section="">
      <p>
        role
        <select name="role">
          <option>base</option>
          <option>rover</option>
        </select>
      </p>
      <button>Apply</button><output></output>
    </form>

    <h3>Net Settings</h3>

    <form data-section="net">
      <p>ip <input name="ip" required /></p>
      <p>mask <input name="mask" required /></p>
      <button>Apply</button><output></output>
    </form>

    <h3>Link Settings</h3>

    <form data-section="link">
      <p>
        passphrase
        <input
          name="passphrase"
          type="password"
          minlength="8"
          maxlength="63"
          placeholder="unchanged"
        />
      </p>
      <p>passphrase_set <input name="passphrase_set" disabled /></p>
      <button>Apply</button><output></output>
    </form>

    <h3>Halow Settings</h3>

    <form data-section="halow">
      <p>
        sub_band
        <select name="sub_band">
          <option>low</option>
          <option>mid</option>
          <option>high</option>
        </select>
      </p>
      <p>
        bw_mhz
        <select name="bw_mhz">
          <option>1</option>
          <option>2</option>
          <option>4</option>
          <option>8</option>
        </select>
      </p>
      <p>tx_power_dbm <input name="tx_power_dbm" type="number" required /></p>
      <p>
        mcs
        <select name="mcs">
          <option>auto</option>
          <option>0</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
        </select>
      </p>
      <button>Apply</button><output></output>
    </form>

    <h3>Wifi 2.4 GHz Settings</h3>

    <form data-section="wifi_2_4">
      <p>channel <input name="channel" type="number" required /></p>
      <p>bw_mhz <input name="bw_mhz" type="number" required /></p>
      <p>tx_power_dbm <input name="tx_power_dbm" type="number" required /></p>
      <button>Apply</button><output></output>
    </form>

    <h3>Wifi 5 GHz Settings</h3>

    <form data-section="wifi_5">
      <p>channel <input name="channel" type="number" required /></p>
      <p>bw_mhz <input name="bw_mhz" type="number" required /></p>
      <p>tx_power_dbm <input name="tx_power_dbm" type="number" required /></p>
      <button>Apply</button><output></output>
    </form>

    <h2>Reboot</h2>
    <form id="reboot"><button>Reboot</button><output></output></form>

    <script>
      const configForms = document.querySelectorAll("form[data-section]");

      function show(outputs, text) {
        for (const output of outputs) output.textContent = text;
      }

      async function request(method, path, body, outputs) {
        const options = {
          method,
          headers: { "Content-Type": "application/json" },
        };
        if (body !== undefined) options.body = JSON.stringify(body);
        show(outputs, "");
        try {
          const response = await fetch("/api" + path, options);
          const text = await response.text();
          if (!response.ok) {
            show(outputs, `${response.status} ${text}`);
            return null;
          }
          show(outputs, method === "GET" ? "" : "ok");
          return JSON.parse(text);
        } catch (error) {
          show(outputs, error.message);
          return null;
        }
      }

      function fillForms(config, forms) {
        if (config === null) return;
        for (const form of forms) {
          const values = form.dataset.section
            ? config[form.dataset.section]
            : config;
          for (const field of form.elements) {
            if (field.name in values)
              field.value = values[field.name] ?? "auto";
          }
        }
      }

      function readForm(form) {
        const values = {};
        for (const field of form.elements) {
          if (!field.name || field.disabled) continue;
          if (field.type === "password" && field.value === "") continue;
          if (field.value === "auto") values[field.name] = null;
          else if (
            field.type === "number" ||
            field.name === "mcs" ||
            field.name === "bw_mhz"
          )
            values[field.name] = Number(field.value);
          else values[field.name] = field.value;
        }
        return form.dataset.section
          ? { [form.dataset.section]: values }
          : values;
      }

      for (const form of configForms) {
        form.onsubmit = async (event) => {
          event.preventDefault();
          const outputs = form.querySelectorAll("output");
          fillForms(await request("POST", "/config", readForm(form), outputs), [form]);
        };
      }

      document.getElementById("reboot").onsubmit = async (event) => {
        event.preventDefault();
        await request("POST", "/reboot", undefined, event.target.querySelectorAll("output"));
      };

      const loadOutputs = document.querySelectorAll("form[data-section] output");
      request("GET", "/config", undefined, loadOutputs).then((config) => fillForms(config, configForms));
    </script>
  </body>
</html>
